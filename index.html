    <!-- Bloqueio extra para impedir que o Google Tradutor mude o DOM -->
    <script>
      (function() {
        // Remove qualquer elemento do Google Translate que apareça
        const removeGoogleTranslate = function() {
          const googleElements = document.querySelectorAll('.goog-te-banner-frame, .goog-te-menu-frame, #goog-gt-tt, .goog-tooltip');
          googleElements.forEach(function(el) {
            if (el) {
              el.style.display = 'none';
              el.remove();
            }
          });
          
          // Remove a classe que o Google adiciona ao body
          document.body.classList.remove('translated-ltr', 'translated-rtl');
        };
        
        // Executa imediatamente e periodicamente
        removeGoogleTranslate();
        setInterval(removeGoogleTranslate, 500);
        
        // Observa mudanças no DOM
        if (window.MutationObserver) {
          const observer = new MutationObserver(removeGoogleTranslate);
          observer.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
